name: Update GitHub Profile

"on":
workflow_dispatch:

jobs:
update-profile:
runs-on: ubuntu-latest

permissions:
  contents: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Create profile directory
    run: mkdir -p profile

  - name: Generate GitHub Statistics
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=KRISHNARAJSINH0&show_icons=true&include_all_commits=true&hide_border=true&theme=github_dark
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Top Languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=KRISHNARAJSINH0&layout=compact&langs_count=8&hide_border=true&theme=github_dark
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit generated cards
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add profile/*.svg
      git commit -m "Update GitHub profile stats" || exit 0
      git push
